# CI 门禁 —— 与 AGENTS.md §6「发布前跑一次」保持同一套检查：全量测试 + 密钥扫描。
# 依赖装 `.[all]`（httpx[h2] / lark-oapi / pycryptodome），与开发 .venv 一致，
# 否则 ws 入站、加密事件体的用例会因缺依赖而假红。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含全部可选依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'
      - name: 全量测试
        run: python -m unittest discover -s tests
      - name: 密钥扫描（0 = 干净）
        run: python3 scripts/scan_secrets.py
