# CI 门禁 —— 与 AGENTS.md §6「发布前跑一次」保持同一套检查：全量测试 + 密钥扫描。
# 依赖装 `.[all]`（httpx[h2] / lark-oapi / pycryptodome），与开发 .venv 一致，
# 否则 ws 入站、加密事件体的用例会因缺依赖而假红。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEWSPIPE_REQUIRE_JS_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装（含全部可选依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'
      - name: 全量测试
        run: python -m unittest discover -s tests
      - name: 密钥扫描（0 = 干净）
        run: python3 scripts/scan_secrets.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEWSPIPE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only browser tooling
        run: pip install -e '.[browser-test]'
      - name: Install real browser engines
        run: python -m playwright install --with-deps chromium webkit
      - name: Workbench browser acceptance
        run: python -m unittest discover -s tests -p test_browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/browser
          retention-days: 7
