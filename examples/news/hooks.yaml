# 卡片 hook —— 第三方（Hermes 侧）往资讯卡片里加按钮，以及接住这些按钮的点击。
#
# 这份文件是**示例模板**：真正的声明要放到数据目录（`NEWSPIPE_HOME/info/news/hooks.yaml`），
# 且只能通过 CLI 写入（先校验后落盘）：
#
#   newspipe hooks add --from-json '{"id":"hermes.wiki","label":"⭐ 入库",
#       "action":"hermes.wiki","handler":"~/bin/news_hook_wiki.sh"}' --json
#   newspipe hooks list --json      # 看声明 + 被跳过的声明（problems）
#   newspipe hooks remove hermes.wiki --json
#
# 硬规则（写错会被拒绝，或按钮点了没反应）：
#
# 1. **只能新增按钮，不能覆盖核心动作** —— 核心是 open_detail / back_to_list / wiki / dismiss；
#    action 必须带命名空间（`vendor.something`），否则被跳过。
# 2. **fail-soft** —— handler 挂了，核心按钮照常工作；项目只记账，不把失败放大。
# 3. **默认只在详情页**（`scope: detail`）。列表页 hook 每一行都要渲染一次，
#    13 行 × 每个按钮会直接撞飞书 200 元素上限（错误码 11310）。
#    确实要在列表页加，先 `newspipe doctor --json` 看 `card_budget.headroom` 还剩多少。
# 4. handler 收 payload（JSON，一行，走 stdin），退出码 0 = 成功；
#    stdout 会被截断到 2KB 当作 toast 回给用户。
#    绝对路径要可执行（`chmod +x`）；也可以写 PATH 上的命令，如 `python3 ~/bin/x.py`。
# 5. 项目**不 import** 宿主的任何模块，宿主也**不 import** 项目 —— 两边只通过这份声明、
#    payload 与事件流说话。这是防腐层的全部内容。
hooks:
  # 示例：详情页多一个「⭐ 入库」按钮。点击后项目记录一条 `favorite` 事件并进
  # state/events 队列；宿主消费队列 → 人确认 → 才真的入库（wiki promote 必须人工确认）。
  - id: hermes.wiki
    label: "⭐ 入库"
    action: hermes.wiki
    scope: detail
    handler: /bin/echo          # ← 换成你的脚本，例如 ~/bin/news_hook_wiki.sh
    timeout_s: 10
    enabled: true

  # 示例：详情页多一个「🔕 屏蔽这个词」。默认 enabled: false —— 声明先放着，
  # 想用时 `newspipe hooks add --from-json ...` 覆盖同一 id 即可。
  - id: hermes.mute
    label: "🔕 屏蔽"
    action: hermes.mute
    scope: detail
    handler: /bin/echo
    enabled: false
