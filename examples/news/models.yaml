# 模型路由 —— AI 加工层的模型与预算（示例配置）
#
# backend 选择解析方式：
#   hermes   —— 跟随 Hermes 当前主模型（读 ~/.hermes/config.yaml 的 model.*，
#               密钥优先取该 provider 的 key_env（~/.hermes/.env），其次 model.api_key）
#   explicit —— 只读本文件：providers.<name>.base_url + key_env（取进程环境变量）
# 也可用环境变量 NEWSPIPE_MODEL_BACKEND 覆盖。
#
# 实测（2026-10-03）：hermes 解析为本机 bridge；config.yaml 里的 model.api_key 已失效（401），
# 有效密钥在 .env —— 所以密钥解析必须 env 优先。

backend: hermes

default: hermes

capabilities:
  summarize:            # 中文标题 + 摘要（article / post / title 三种口径共用）
    model: hermes
  translate:            # 正文/帖子逐块翻译
    model: hermes
  priority_judge:       # 预留：优先级自动判定（暂不启用，手动指定优先）
    enabled: false
    model: hermes

# explicit 后端用这张表；hermes 后端只把它当补充
providers: {}
#   example_cloud:
#     base_url: "https://api.example.com/v1"
#     key_env: "EXAMPLE_API_KEY"

budget:
  max_calls_per_day: 400      # 单日模型调用上限
  max_calls_per_hour: 80
  max_chars_per_call: 8000    # 单次请求正文字符上限（超长截断并标 incomplete）
  # 推理模型的 reasoning 与答案**共用** completion 预算：给 1024 会被思考吃光，
  # 返回 finish_reason=length + content 为空 ⇒ 整批降级为原文标题（实测 10/12）。
  max_tokens: 4096            # 单次 completion 上限（思考 + 答案都要装得下）
  max_tokens_ceiling: 8192    # 思考吃满预算时翻倍重试的上限
  on_exceeded: degrade        # degrade（不加工，用原文标题继续发卡）| stop
  timeout_seconds: 90
