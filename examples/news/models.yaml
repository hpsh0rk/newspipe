# 模型路由 —— AI 加工层的模型与预算（示例配置）
#
# backend 选择解析方式：
#   explicit —— **推荐起步**：只读本文件。providers.<name>.base_url + key_env（取进程环境
#               变量）。不读任何宿主文件，完全可独立运行。
#   host     —— 跟随**宿主 Agent** 当前主模型：读宿主配置目录（NEWSPIPE_HOST_HOME）下的
#               config.yaml 的 model.* / providers / model_aliases，密钥优先取该 provider 的
#               key_env（宿主 .env），其次 model.api_key。
#               好处是不必为本项目再配一份 API key；宿主换模型时这里跟着换。
#               用 host 时把下面所有 `model:` 写成 `host`（也接受历史写法 `hermes`）。
#               没配 NEWSPIPE_HOST_HOME 会直接报错并给修法（刻意不猜目录）。
# 也可用环境变量 NEWSPIPE_MODEL_BACKEND 覆盖。
#
# 密钥解析顺序是「env 优先」：配置里的 api_key 可能早已失效，而 .env 里的仍可用。

backend: explicit

default: example_cloud:chat-model

capabilities:
  summarize:            # 中文标题 + 摘要（article / post / title 三种口径共用）
    model: example_cloud:chat-model
  translate:            # 正文/帖子逐块翻译
    model: example_cloud:chat-model
  priority_judge:       # 预留：优先级自动判定（暂不启用，手动指定优先）
    enabled: false
    model: example_cloud:chat-model

# explicit 后端用这张表；host 后端只把它当补充
providers:
  example_cloud:
    base_url: "https://api.example.com/v1"
    key_env: "EXAMPLE_API_KEY"        # 从进程环境变量读，密钥不落盘

budget:
  max_calls_per_day: 400      # 单日模型调用上限
  max_calls_per_hour: 80
  max_chars_per_call: 8000    # 单次请求正文字符上限（超长截断并标 incomplete）
  # 推理模型的 reasoning 与答案**共用** completion 预算：给 1024 会被思考吃光，
  # 返回 finish_reason=length + content 为空 ⇒ 整批降级为原文标题（实测 10/12）。
  max_tokens: 4096            # 单次 completion 上限（思考 + 答案都要装得下）
  max_tokens_ceiling: 8192    # 思考吃满预算时翻倍重试的上限
  on_exceeded: degrade        # degrade（不加工，用原文标题继续发卡）| stop
  timeout_seconds: 90
