<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .regular { font-weight: 400; }
    </style>
  </defs>

  <rect width="1200" height="1060" fill="#FFFFFF"/>

  <!-- 标题与设计方案标注 -->
  <text x="48" y="48" class="txt bold" font-size="22" fill="#0A0A0A">🧩 公共组件全状态视觉规范与颜色字典</text>
  <text x="48" y="76" class="txt regular" font-size="14" fill="#525252">
    选定方案: <tspan class="semibold" fill="#0A0A0A">方案 E: 黑白极简大留白 (Monochrome Editorial)</tspan> | 主题: mono-light | WCAG 对比度得分: 99/100
  </text>
  <line x1="48" y1="96" x2="1152" y2="96" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ================= SECTION 1: 按钮组件 (Button States) ================= -->
  <text x="48" y="132" class="txt bold" font-size="16" fill="#0A0A0A">1. 按钮组件 (Button States)</text>
  <text x="48" y="152" class="txt regular" font-size="12" fill="#525252">必须明确 Default, Hover, Active, Focus, Disabled 五态颜色与交互投影</text>

  <!-- Button: Default -->
  <g transform="translate(48, 170)">
    <rect width="130" height="40" rx="6" fill="#0A0A0A" stroke="transparent"/>
    <text x="65" y="25" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">Default</text>
    <text x="65" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">默认态 (#0A0A0A)</text>
  </g>

  <!-- Button: Hover -->
  <g transform="translate(200, 170)">
    <rect width="130" height="40" rx="6" fill="#262626" stroke="transparent"/>
    <text x="65" y="25" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">Hover</text>
    <text x="65" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">悬停态 (#262626)</text>
  </g>

  <!-- Button: Active -->
  <g transform="translate(352, 170)">
    <rect width="130" height="40" rx="6" fill="#000000" stroke="transparent"/>
    <text x="65" y="25" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">Active</text>
    <text x="65" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">按压激活态</text>
  </g>

  <!-- Button: Focus -->
  <g transform="translate(504, 170)">
    <rect width="130" height="40" rx="6" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <text x="65" y="25" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">Focus Ring</text>
    <text x="65" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">键盘聚焦外环</text>
  </g>

  <!-- Button: Disabled -->
  <g transform="translate(656, 170)">
    <rect width="130" height="40" rx="6" fill="#F0F0F0" stroke="transparent"/>
    <text x="65" y="25" class="txt semibold" font-size="13" fill="#8F8F8F" text-anchor="middle">Disabled</text>
    <text x="65" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">禁用置灰态</text>
  </g>

  <!-- 次级按钮 (Secondary Button) -->
  <g transform="translate(808, 170)">
    <rect width="140" height="40" rx="6" fill="#525252" stroke="transparent"/>
    <text x="70" y="25" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">Secondary Btn</text>
    <text x="70" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">次级操作按钮</text>
  </g>

  <g transform="translate(968, 170)">
    <rect width="140" height="40" rx="6" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <text x="70" y="25" class="txt semibold" font-size="13" fill="#0A0A0A" text-anchor="middle">Outline Btn</text>
    <text x="70" y="56" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">幽灵边框按钮</text>
  </g>

  <!-- ================= SECTION 2: 输入框组件 (Input States) ================= -->
  <line x1="48" y1="250" x2="1152" y2="250" stroke="#E5E5E5" stroke-width="1"/>
  <text x="48" y="286" class="txt bold" font-size="16" fill="#0A0A0A">2. 输入框组件 (Input States)</text>

  <!-- Input: Default -->
  <g transform="translate(48, 306)">
    <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="26" class="txt regular" font-size="13" fill="#8F8F8F">请输入内容...</text>
    <text x="100" y="60" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">Default (默认态)</text>
  </g>

  <!-- Input: Hover -->
  <g transform="translate(268, 306)">
    <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1"/>
    <text x="16" y="26" class="txt regular" font-size="13" fill="#0A0A0A">用户正在输入</text>
    <text x="100" y="60" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">Hover (悬停态)</text>
  </g>

  <!-- Input: Focus -->
  <g transform="translate(488, 306)">
    <rect width="200" height="42" rx="6" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <text x="16" y="26" class="txt regular" font-size="13" fill="#0A0A0A">聚焦激活态|</text>
    <text x="100" y="60" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">Focus (高亮外框)</text>
  </g>

  <!-- Input: Error -->
  <g transform="translate(708, 306)">
    <rect width="200" height="42" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="16" y="26" class="txt regular" font-size="13" fill="#B91C1C">时长不能少于15分钟</text>
    <text x="100" y="60" class="txt regular" font-size="11" fill="#B91C1C" text-anchor="middle">Error (非法校验报错)</text>
  </g>

  <!-- Input: Disabled -->
  <g transform="translate(928, 306)">
    <rect width="200" height="42" rx="6" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1"/>
    <text x="16" y="26" class="txt regular" font-size="13" fill="#8F8F8F">只读不可修改</text>
    <text x="100" y="60" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">Disabled (禁用态)</text>
  </g>

  <!-- ================= SECTION 3: 标签与徽章 (Badges & Status Tags) ================= -->
  <line x1="48" y1="390" x2="1152" y2="390" stroke="#E5E5E5" stroke-width="1"/>
  <text x="48" y="426" class="txt bold" font-size="16" fill="#0A0A0A">3. 状态徽章 (Status Badges)</text>

  <!-- Success Badge -->
  <g transform="translate(48, 446)">
    <rect width="110" height="28" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="55" y="19" class="txt bold" font-size="12" fill="#15803D" text-anchor="middle">● 校验通过</text>
  </g>

  <!-- Warning Badge -->
  <g transform="translate(178, 446)">
    <rect width="110" height="28" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="55" y="19" class="txt bold" font-size="12" fill="#B45309" text-anchor="middle">▲ 临近考期</text>
  </g>

  <!-- Error Badge -->
  <g transform="translate(308, 446)">
    <rect width="110" height="28" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="55" y="19" class="txt bold" font-size="12" fill="#B91C1C" text-anchor="middle">✕ 门禁拦截</text>
  </g>

  <!-- Info Badge -->
  <g transform="translate(438, 446)">
    <rect width="110" height="28" rx="14" fill="#F5F5F5" stroke="#E5E5E5"/>
    <text x="55" y="19" class="txt bold" font-size="12" fill="#404040" text-anchor="middle">ℹ 进行中</text>
  </g>

  <!-- ================= SECTION 4: 基础色彩值色板 (Color Palette Swatches) ================= -->
  <line x1="48" y1="500" x2="1152" y2="500" stroke="#E5E5E5" stroke-width="1"/>
  <text x="48" y="536" class="txt bold" font-size="16" fill="#0A0A0A">4. 调色盘与色阶基线 (Color Palette)</text>

  <!-- Color 1: Primary -->
  <g transform="translate(48, 556)">
    <rect width="90" height="50" rx="8" fill="#0A0A0A"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Primary</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#0A0A0A</text>
  </g>

  <!-- Color 2: Secondary -->
  <g transform="translate(158, 556)">
    <rect width="90" height="50" rx="8" fill="#525252"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Secondary</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#525252</text>
  </g>

  <!-- Color 3: Accent -->
  <g transform="translate(268, 556)">
    <rect width="90" height="50" rx="8" fill="#0A0A0A"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Accent</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#0A0A0A</text>
  </g>

  <!-- Color 4: Background -->
  <g transform="translate(378, 556)">
    <rect width="90" height="50" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Background</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#FFFFFF</text>
  </g>

  <!-- Color 5: Surface -->
  <g transform="translate(488, 556)">
    <rect width="90" height="50" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Surface</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#FAFAFA</text>
  </g>

  <!-- Color 6: TextPrimary -->
  <g transform="translate(598, 556)">
    <rect width="90" height="50" rx="8" fill="#0A0A0A"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Text Primary</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#0A0A0A</text>
  </g>

  <!-- Color 7: Border -->
  <g transform="translate(708, 556)">
    <rect width="90" height="50" rx="8" fill="#E5E5E5"/>
    <text x="45" y="72" class="txt semibold" font-size="12" fill="#0A0A0A" text-anchor="middle">Border</text>
    <text x="45" y="88" class="txt regular" font-size="11" fill="#525252" text-anchor="middle">#E5E5E5</text>
  </g>

  <!-- ================= SECTION 5: 字体层级与图标标准 (Typography & Icons) ================= -->
  <line x1="48" y1="670" x2="1152" y2="670" stroke="#E5E5E5" stroke-width="1"/>
  <text x="48" y="706" class="txt bold" font-size="16" fill="#0A0A0A">5. 字体排版标尺与图标规格 (Typography &amp; Icons)</text>

  <g transform="translate(48, 730)">
    <text x="0" y="24" class="txt bold" font-size="24" fill="#0A0A0A">Display 24px - 模块主标题</text>
    <text x="0" y="56" class="txt semibold" font-size="18" fill="#0A0A0A">Heading 18px - 卡片与区块分组标题</text>
    <text x="0" y="84" class="txt regular" font-size="14" fill="#0A0A0A">Body 14px - 界面正文、表格内容与默认控件文字</text>
    <text x="0" y="108" class="txt regular" font-size="12" fill="#525252">Caption 12px - 辅助提示、标签、微小元数据</text>
  </g>

  <g transform="translate(700, 730)">
    <text x="0" y="20" class="txt bold" font-size="14" fill="#0A0A0A">图标系统标准 (Icon System):</text>
    <text x="0" y="44" class="txt regular" font-size="13" fill="#525252">• 图标库: Lucide Icons</text>
    <text x="0" y="68" class="txt regular" font-size="13" fill="#525252">• 描边粗细: 1.5px</text>
    <text x="0" y="92" class="txt regular" font-size="13" fill="#525252">• 标准规格阶梯: 16px (sm) / 20px (md) / 24px (lg) / 32px (xl)</text>
  </g>

  <!-- ================= SECTION 6: 补全状态 (Loading / Checkbox / Link / Numeric) ================= -->
  <line x1="48" y1="866" x2="1152" y2="866" stroke="#E5E5E5" stroke-width="1"/>
  <text x="48" y="902" class="txt bold" font-size="16" fill="#0A0A0A">6. 补全状态 (Loading / Checkbox / Link / Numeric)</text>
  <text x="48" y="922" class="txt regular" font-size="12" fill="#525252">提交态与选择态缺失时开发者会在业务里现编; 数字不等宽则数值列随位数跳动</text>

  <!-- Button: Loading -->
  <g transform="translate(48, 940)">
    <rect width="150" height="40" rx="8" fill="#0A0A0A"/>
    <circle cx="22" cy="20" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="22 12"/>
    <text x="42" y="25" class="txt semibold" font-size="13" fill="#FFFFFF">提交中…</text>
    <text x="0" y="58" class="txt regular" font-size="11" fill="#525252">Button Loading (progress)</text>
  </g>

  <!-- Checkbox: 四态 -->
  <g transform="translate(240, 940)">
    <rect width="20" height="20" rx="4" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1.5"/>
    <text x="28" y="16" class="txt regular" font-size="12" fill="#0A0A0A">未选</text>
    <text x="0" y="58" class="txt regular" font-size="11" fill="#525252">Checkbox Default</text>
  </g>
  <g transform="translate(370, 940)">
    <rect width="20" height="20" rx="4" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
    <text x="5" y="16" class="txt bold" font-size="13" fill="#FFFFFF">✓</text>
    <text x="28" y="16" class="txt regular" font-size="12" fill="#0A0A0A">已选</text>
    <text x="0" y="58" class="txt regular" font-size="11" fill="#525252">Checkbox Checked</text>
  </g>
  <g transform="translate(500, 940)">
    <rect width="20" height="20" rx="4" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="5" y="9" width="10" height="3" rx="1.5" fill="#FFFFFF"/>
    <text x="28" y="16" class="txt regular" font-size="12" fill="#0A0A0A">半选</text>
    <text x="0" y="58" class="txt regular" font-size="11" fill="#525252">Checkbox Indeterminate</text>
  </g>
  <g transform="translate(640, 940)">
    <rect width="20" height="20" rx="4" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="28" y="16" class="txt regular" font-size="12" fill="#525252">禁用</text>
    <text x="0" y="58" class="txt regular" font-size="11" fill="#525252">Checkbox Disabled</text>
  </g>

  <!-- Text Link: 三态 -->
  <g transform="translate(800, 940)">
    <text x="0" y="16" class="txt regular" font-size="13" fill="#0A0A0A">默认链接</text>
    <text x="0" y="38" class="txt regular" font-size="13" fill="#262626" text-decoration="underline">悬停链接</text>
    <text x="0" y="60" class="txt regular" font-size="13" fill="#000000" text-decoration="underline">按压链接</text>
    <text x="0" y="86" class="txt regular" font-size="11" fill="#525252">Text Link (Default/Hover/Active)</text>
  </g>

  <!-- Numeric: 等宽数字纵向对齐 -->
  <g transform="translate(980, 940)">
    <text x="0" y="16" class="txt bold" font-size="20" fill="#0A0A0A" text-anchor="end" style="font-variant-numeric: tnum 1, lnum 1;">1,284,930</text>
    <text x="0" y="42" class="txt bold" font-size="20" fill="#0A0A0A" text-anchor="end" style="font-variant-numeric: tnum 1, lnum 1;">88,204</text>
    <text x="0" y="68" class="txt bold" font-size="20" fill="#0A0A0A" text-anchor="end" style="font-variant-numeric: tnum 1, lnum 1;">7,915</text>
    <text x="0" y="92" class="txt regular" font-size="11" fill="#525252">等宽数字 tabular-nums</text>
  </g>
</svg>