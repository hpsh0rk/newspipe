<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .regular { font-weight: 400; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 全局背景 -->
  <rect width="1200" height="750" fill="#F8FAFC"/>

  <!-- 顶部导航栏 (Header) -->
  <rect x="0" y="0" width="1200" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Logo 标识 -->
  <rect x="32" y="16" width="32" height="32" rx="8" fill="#2563EB"/>
  <path d="M42 32 L46 36 L54 28" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="76" y="38" class="txt bold" font-size="18" fill="#0F172A">newspipe</text>
  <text x="180" y="38" class="txt regular" font-size="12" fill="#64748B">[方案 A]</text>

  <!-- 导航条目 -->
  <text x="320" y="38" class="txt semibold" font-size="14" fill="#2563EB">控制台概览</text>
  <rect x="320" y="60" width="70" height="3" fill="#2563EB" rx="1.5"/>
  <text x="430" y="38" class="txt regular" font-size="14" fill="#64748B">任务编排</text>
  <text x="520" y="38" class="txt regular" font-size="14" fill="#64748B">监控审计</text>
  <text x="610" y="38" class="txt regular" font-size="14" fill="#64748B">设计系统</text>

  <!-- 顶部右侧用户信息与操作 -->
  <rect x="1040" y="18" width="128" height="32" rx="6" fill="#2563EB" filter="url(#shadow)"/>
  <text x="1104" y="39" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">+ 新建任务</text>
  <circle cx="1000" cy="34" r="16" fill="#E2E8F0"/>
  <text x="1000" y="39" class="txt bold" font-size="12" fill="#0F172A" text-anchor="middle">JD</text>

  <!-- 左侧侧边栏 (Sidebar) -->
  <rect x="0" y="64" width="220" height="686" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="16" y="88" width="188" height="40" rx="8" fill="#EFF6FF"/>
  <text x="48" y="113" class="txt semibold" font-size="14" fill="#2563EB">📊 数据仪表盘</text>
  <text x="48" y="160" class="txt regular" font-size="14" fill="#64748B">📁 业务领域管理</text>
  <text x="48" y="204" class="txt regular" font-size="14" fill="#64748B">🛡️ 架构与门禁</text>
  <text x="48" y="248" class="txt regular" font-size="14" fill="#64748B">⚙️ 系统配置</text>

  <!-- 主体工作区 (Main Content) -->
  <text x="256" y="112" class="txt bold" font-size="24" fill="#0F172A">平台概览与核心指标</text>
  <text x="256" y="136" class="txt regular" font-size="14" fill="#64748B">实时聚合当前多工作区、任务流水线及各领域状态</text>

  <!-- 3 组指标卡片 (Metrics Cards) -->
  <g filter="url(#shadow)">
    <!-- 卡片 1 -->
    <rect x="256" y="160" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="280" y="196" class="txt regular" font-size="14" fill="#64748B">活跃用例总数</text>
    <text x="280" y="240" class="txt bold" font-size="32" fill="#0F172A">142</text>
    <rect x="460" y="180" width="56" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="488" y="196" class="txt bold" font-size="12" fill="#065F46" text-anchor="middle">+12%</text>

    <!-- 卡片 2 -->
    <rect x="560" y="160" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="584" y="196" class="txt regular" font-size="14" fill="#64748B">门禁通过率 (Gatekeeper)</text>
    <text x="584" y="240" class="txt bold" font-size="32" fill="#0F172A">99.4%</text>
    <rect x="764" y="180" width="56" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="792" y="196" class="txt bold" font-size="12" fill="#1E40AF" text-anchor="middle">全绿</text>

    <!-- 卡片 3 -->
    <rect x="864" y="160" width="296" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="888" y="196" class="txt regular" font-size="14" fill="#64748B">架构合规度 (DDD 4-Layer)</text>
    <text x="888" y="240" class="txt bold" font-size="32" fill="#2563EB">100%</text>
    <text x="888" y="264" class="txt regular" font-size="12" fill="#065F46">0 违规 / 0 坏味道</text>
  </g>

  <!-- 下部主图表与列表区 (Table / List Box) -->
  <g filter="url(#shadow)">
    <rect x="256" y="304" width="904" height="400" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- 表格标题与搜索栏 -->
    <text x="280" y="344" class="txt bold" font-size="16" fill="#0F172A">核心领域用例执行流水线</text>
    <rect x="860" y="324" width="276" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="876" y="347" class="txt regular" font-size="13" fill="#64748B">🔍 搜索领域、用例或状态...</text>

    <!-- 表头 -->
    <line x1="256" y1="376" x2="1160" y2="376" stroke="#E2E8F0" stroke-width="1"/>
    <text x="280" y="398" class="txt semibold" font-size="13" fill="#64748B">用例名称</text>
    <text x="520" y="398" class="txt semibold" font-size="13" fill="#64748B">领域上下文</text>
    <text x="700" y="398" class="txt semibold" font-size="13" fill="#64748B">单测覆盖</text>
    <text x="860" y="398" class="txt semibold" font-size="13" fill="#64748B">阶段状态</text>
    <text x="1060" y="398" class="txt semibold" font-size="13" fill="#64748B">操作</text>

    <!-- 行 1 -->
    <line x1="256" y1="416" x2="1160" y2="416" stroke="#E2E8F0" stroke-width="1"/>
    <text x="280" y="444" class="txt bold" font-size="14" fill="#0F172A">UserAuthenticationWorkflow</text>
    <text x="520" y="444" class="txt regular" font-size="14" fill="#64748B">AuthDomain</text>
    <text x="700" y="444" class="txt semibold" font-size="14" fill="#2563EB">98.2%</text>
    <rect x="860" y="428" width="76" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="898" y="444" class="txt bold" font-size="12" fill="#065F46" text-anchor="middle">已上线</text>
    <text x="1060" y="444" class="txt semibold" font-size="13" fill="#2563EB">查看详情</text>

    <!-- 行 2 -->
    <line x1="256" y1="468" x2="1160" y2="468" stroke="#E2E8F0" stroke-width="1"/>
    <text x="280" y="496" class="txt bold" font-size="14" fill="#0F172A">StudyScheduleOptimizer</text>
    <text x="520" y="496" class="txt regular" font-size="14" fill="#64748B">PlannerDomain</text>
    <text x="700" y="496" class="txt semibold" font-size="14" fill="#2563EB">100%</text>
    <rect x="860" y="480" width="76" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="898" y="496" class="txt bold" font-size="12" fill="#1E40AF" text-anchor="middle">运行中</text>
    <text x="1060" y="496" class="txt semibold" font-size="13" fill="#2563EB">查看详情</text>

    <!-- 行 3 -->
    <line x1="256" y1="520" x2="1160" y2="520" stroke="#E2E8F0" stroke-width="1"/>
    <text x="280" y="548" class="txt bold" font-size="14" fill="#0F172A">HighFidelityDesignSync</text>
    <text x="520" y="548" class="txt regular" font-size="14" fill="#64748B">DesignDomain</text>
    <text x="700" y="548" class="txt semibold" font-size="14" fill="#2563EB">95.0%</text>
    <rect x="860" y="532" width="76" height="24" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="898" y="548" class="txt bold" font-size="12" fill="#92400E" text-anchor="middle">待审核</text>
    <text x="1060" y="548" class="txt semibold" font-size="13" fill="#2563EB">查看详情</text>
  </g>
</svg>