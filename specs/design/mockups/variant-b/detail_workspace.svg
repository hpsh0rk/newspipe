<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .regular { font-weight: 400; }
    </style>
    <filter id="detail-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0B0F19"/>

  <!-- 顶部面包屑与标题条 -->
  <rect x="0" y="0" width="1200" height="72" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="48" y="32" class="txt regular" font-size="13" fill="#9CA3AF">项目看板 / 用例详情 / </text>
  <text x="180" y="32" class="txt semibold" font-size="13" fill="#4D9EF7">UC-2026-PLANNER-CORE</text>
  <text x="48" y="56" class="txt bold" font-size="20" fill="#F9FAFB">学习规划生成器 (Study Schedule Planner)</text>

  <!-- 顶部右侧状态与操作 -->
  <rect x="1020" y="20" width="132" height="36" rx="6" fill="#4D9EF7"/>
  <text x="1086" y="43" class="txt semibold" font-size="13" fill="#FFFFFF" text-anchor="middle">保存并发布规范</text>

  <!-- 左栏：表单与参数配置 (60% 宽度) -->
  <g filter="url(#detail-shadow)">
    <rect x="48" y="96" width="680" height="610" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="80" y="136" class="txt bold" font-size="16" fill="#F9FAFB">用例元契约与输入参数 (Input Contract)</text>
    
    <!-- 表单项 1 -->
    <text x="80" y="180" class="txt semibold" font-size="13" fill="#F9FAFB">目标考期 (Target Exam Date) <tspan fill="#FCA5A5">*</tspan></text>
    <rect x="80" y="196" width="616" height="42" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
    <text x="96" y="222" class="txt regular" font-size="14" fill="#F9FAFB">2026-11-20 (距离考试还有 58 天)</text>

    <!-- 表单项 2 -->
    <text x="80" y="264" class="txt semibold" font-size="13" fill="#F9FAFB">每日可用专注时长 (Available Minutes/Day) <tspan fill="#FCA5A5">*</tspan></text>
    <rect x="80" y="280" width="616" height="42" rx="6" fill="#0B0F19" stroke="#4D9EF7" stroke-width="1.5"/>
    <text x="96" y="306" class="txt regular" font-size="14" fill="#F9FAFB">120 分钟 (2小时/天，平滑递进策略)</text>

    <!-- 表单项 3: 单选策略模式 -->
    <text x="80" y="348" class="txt semibold" font-size="13" fill="#F9FAFB">规划算法画像模式 (Planner Profile)</text>
    <rect x="80" y="364" width="190" height="48" rx="8" fill="#12325C" stroke="#4D9EF7" stroke-width="1.5"/>
    <circle cx="104" cy="388" r="6" fill="#4D9EF7"/>
    <text x="122" y="393" class="txt semibold" font-size="13" fill="#4D9EF7">4 阶段平滑递进</text>

    <rect x="290" y="364" width="190" height="48" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="314" cy="388" r="6" fill="#1F2937"/>
    <text x="332" y="393" class="txt regular" font-size="13" fill="#9CA3AF">极限突击冲刺</text>

    <!-- 代码契约预览框 -->
    <text x="80" y="444" class="txt semibold" font-size="13" fill="#F9FAFB">领域返回值契约 JSON Schema</text>
    <rect x="80" y="456" width="616" height="220" rx="8" fill="#030712"/>
    <text x="100" y="488" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#38BDF8">{</text>
    <text x="116" y="512" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0">  "planId": "plan_991823",</text>
    <text x="116" y="536" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0">  "stages": [ "基础夯实", "专项攻克", "全真模考", "查漏冲刺" ],</text>
    <text x="116" y="560" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0">  "dailyTargetMinutes": 120,</text>
    <text x="116" y="584" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#34D399">  "status": "VALIDATED"</text>
    <text x="100" y="608" class="txt regular" font-family="ui-monospace, monospace" font-size="12" fill="#38BDF8">}</text>
  </g>

  <!-- 右栏：审计检查与门禁状态 (40% 宽度) -->
  <g filter="url(#detail-shadow)">
    <rect x="752" y="96" width="400" height="610" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="780" y="136" class="txt bold" font-size="16" fill="#F9FAFB">🛡️ 架构防腐与门禁诊断</text>

    <!-- 门禁检查项 1 -->
    <rect x="780" y="160" width="344" height="64" rx="8" fill="#064E3B" stroke="#059669"/>
    <text x="800" y="196" class="txt bold" font-size="14" fill="#6EE7B7">✅ 领域层单向依赖合规</text>
    <text x="800" y="214" class="txt regular" font-size="12" fill="#6EE7B7">Domain 无跨层 import，IO 完全倒置</text>

    <!-- 门禁检查项 2 -->
    <rect x="780" y="240" width="344" height="64" rx="8" fill="#064E3B" stroke="#059669"/>
    <text x="800" y="276" class="txt bold" font-size="14" fill="#6EE7B7">✅ 结构化错误契约 (AppError)</text>
    <text x="800" y="294" class="txt regular" font-size="12" fill="#6EE7B7">无裸 Error，无空 catch，包含 hint</text>

    <!-- 门禁检查项 3: 前端高保真设计契约 -->
    <rect x="780" y="320" width="344" height="84" rx="8" fill="#1E3A8A" stroke="#2563EB"/>
    <text x="800" y="352" class="txt bold" font-size="14" fill="#93C5FD">🎨 前端高保真设计契约</text>
    <text x="800" y="372" class="txt regular" font-size="12" fill="#93C5FD">Design Tokens: 已锁定 (方案 B)</text>
    <text x="800" y="390" class="txt regular" font-size="12" fill="#93C5FD">公共组件多态色系: 100% 完备</text>

    <!-- 底部操作按钮 -->
    <rect x="780" y="630" width="344" height="44" rx="8" fill="#4D9EF7"/>
    <text x="952" y="657" class="txt semibold" font-size="14" fill="#FFFFFF" text-anchor="middle">执行全量自动化门禁自检</text>
  </g>
</svg>